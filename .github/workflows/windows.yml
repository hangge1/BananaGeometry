name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    # build.ps1 uses the VS 2022 generator; windows-latest now ships VS 2026.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install format tools
        run: |
          python -m pip install --disable-pip-version-check clang-format==19.1.5
          if ($LASTEXITCODE -ne 0) { throw 'clang-format installation failed' }
          ./tools/setup-stylua.ps1
      - name: Validate and package
        run: ./tools/validate.ps1 -Configuration Release -Benchmarks -Screenshots -Package
      - name: Check source-only portability
        run: ./tools/validation/check-portability.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Drawer-Windows-x64
          path: out/Drawer/
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Quality-reports
          path: artifacts/validation/
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: Failed-validation-inputs
          path: .tmp/validation/
          include-hidden-files: true
